<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="pin" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- drop shadow pin -->
  <ellipse cx="32" cy="62" rx="8" ry="3" fill="#000" opacity="0.25"/>
  <!-- pin body -->
  <path d="M32,4 C18,4 10,14 10,24 C10,38 32,60 32,60 C32,60 54,38 54,24 C54,14 46,4 32,4 Z"
    fill="url(#pin)" stroke="#800000" stroke-width="2" filter="url(#shadow)"/>
  <!-- inner circle -->
  <circle cx="32" cy="24" r="12" fill="white" stroke="#cc0000" stroke-width="2"/>
  <!-- rail cross inside -->
  <rect x="28" y="16" width="8" height="16" rx="2" fill="#FF0000"/>
  <rect x="22" y="22" width="20" height="8" rx="2" fill="#FF0000"/>
  <!-- center dot -->
  <circle cx="32" cy="26" r="4" fill="white"/>
  <circle cx="32" cy="26" r="2" fill="#FF0000"/>
  <!-- ring pulse -->
  <circle cx="32" cy="24" r="16" fill="none" stroke="#FF0000" stroke-width="1" opacity="0.3"/>
</svg>