<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0622a"/>
      <stop offset="100%" stop-color="#5a1a00"/>
    </radialGradient>
  </defs>
  <!-- gear teeth -->
  <g fill="#8B4513" stroke="#5a1a00" stroke-width="0.5">
    <rect x="28" y="2" width="8" height="10" rx="2"/>
    <rect x="28" y="52" width="8" height="10" rx="2"/>
    <rect x="2" y="28" width="10" height="8" rx="2"/>
    <rect x="52" y="28" width="10" height="8" rx="2"/>
    <rect x="10.5" y="8" width="8" height="10" rx="2" transform="rotate(45 14.5 13)"/>
    <rect x="45.5" y="8" width="8" height="10" rx="2" transform="rotate(-45 49.5 13)"/>
    <rect x="10.5" y="46" width="8" height="10" rx="2" transform="rotate(-45 14.5 51)"/>
    <rect x="45.5" y="46" width="8" height="10" rx="2" transform="rotate(45 49.5 51)"/>
  </g>
  <!-- main body -->
  <circle cx="32" cy="32" r="18" fill="url(#g1)" stroke="#3a0e00" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#3a0e00" stroke-width="2"/>
  <!-- spokes -->
  <line x1="32" y1="14" x2="32" y2="22" stroke="#3a0e00" stroke-width="2"/>
  <line x1="32" y1="42" x2="32" y2="50" stroke="#3a0e00" stroke-width="2"/>
  <line x1="14" y1="32" x2="22" y2="32" stroke="#3a0e00" stroke-width="2"/>
  <line x1="42" y1="32" x2="50" y2="32" stroke="#3a0e00" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" fill="#3a0e00"/>
</svg>