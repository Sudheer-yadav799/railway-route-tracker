<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- road -->
  <rect x="22" y="0" width="20" height="64" fill="#444" opacity="0.3"/>
  <!-- gate posts -->
  <rect x="4" y="30" width="6" height="30" rx="2" fill="#FFD700" stroke="#cc9900" stroke-width="1"/>
  <rect x="54" y="30" width="6" height="30" rx="2" fill="#FFD700" stroke="#cc9900" stroke-width="1"/>
  <!-- boom arm left (horizontal closed) -->
  <rect x="10" y="33" width="28" height="5" rx="2" fill="#FFD700"/>
  <rect x="10" y="33" width="7" height="5" fill="#cc0000"/>
  <rect x="21" y="33" width="7" height="5" fill="#cc0000"/>
  <!-- boom arm right -->
  <rect x="26" y="33" width="28" height="5" rx="2" fill="#FFD700"/>
  <rect x="40" y="33" width="7" height="5" fill="#cc0000"/>
  <!-- warning light -->
  <circle cx="7" cy="26" r="5" fill="#ff2200" stroke="#cc0000" stroke-width="1"/>
  <circle cx="7" cy="26" r="2.5" fill="#ff8888" opacity="0.7"/>
  <!-- X crossing sign -->
  <circle cx="32" cy="14" r="10" fill="#ffee00" stroke="#cc0000" stroke-width="2"/>
  <text x="32" y="19" text-anchor="middle" font-size="12" fill="#cc0000" font-weight="bold" font-family="Arial">✕</text>
</svg>