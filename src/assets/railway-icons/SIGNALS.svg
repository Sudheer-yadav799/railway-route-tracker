    <!-- housing shadow -->
    <rect x="10" y="8" width="40" height="72" rx="10" ry="10" fill="#111" opacity="0.25" transform="translate(2,2)"/>
    <!-- housing -->
    <rect x="10" y="8" width="40" height="72" rx="10" ry="10" fill="#1a1a1a"/>
    <!-- red lens -->
    <circle cx="30" cy="32" r="13" fill="#cc0000"/>
    <circle cx="30" cy="32" r="11" fill="#ff2a2a"/>
    <circle cx="26" cy="28" r="3" fill="rgba(255,255,255,0.25)"/>
    <!-- amber lens -->
    <circle cx="30" cy="62" r="10" fill="#b8860b"/>
    <circle cx="30" cy="62" r="8" fill="#ffc200"/>
    <circle cx="27" cy="59" r="2.5" fill="rgba(255,255,255,0.25)"/>
    <!-- bracket -->
    <rect x="27" y="76" width="6" height="8" fill="#555"/>
