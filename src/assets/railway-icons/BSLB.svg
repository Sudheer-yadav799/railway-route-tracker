<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- post -->
  <rect x="30" y="50" width="4" height="14" fill="#555"/>
  <rect x="24" y="62" width="16" height="2" rx="1" fill="#444"/>
  <!-- board background - checkered black/white pattern like real BSLB -->
  <rect x="8" y="6" width="48" height="44" rx="3" fill="white" stroke="#333" stroke-width="2"/>
  <!-- checkers -->
  <rect x="8" y="6" width="12" height="11" fill="#000" rx="2"/>
  <rect x="32" y="6" width="12" height="11" fill="#000"/>
  <rect x="8" y="28" width="12" height="11" fill="#000"/>
  <rect x="32" y="28" width="12" height="11" fill="#000"/>
  <rect x="20" y="17" width="12" height="11" fill="#000"/>
  <rect x="44" y="17" width="12" height="11" fill="#000" rx="0"/>
  <rect x="20" y="39" width="12" height="11" fill="#000"/>
  <rect x="44" y="39" width="12" height="11" fill="#000"/>
  <!-- label -->
  <rect x="8" y="6" width="48" height="44" rx="3" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="12" y="46" width="40" height="0" fill="none"/>
  <!-- BSLB text overlay band -->
  <rect x="8" y="38" width="48" height="12" rx="2" fill="#00CED1" opacity="0.88"/>
  <text x="32" y="48" text-anchor="middle" font-size="9" fill="white" font-family="Arial" font-weight="bold">BSLB</text>
</svg>