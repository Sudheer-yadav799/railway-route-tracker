<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>
  <!-- railway tracks below -->
  <rect x="0" y="48" width="64" height="5" rx="1" fill="#4B0082" opacity="0.5"/>
  <line x1="0" y1="49" x2="64" y2="49" stroke="#6600aa" stroke-width="1.5"/>
  <line x1="0" y1="51" x2="64" y2="51" stroke="#6600aa" stroke-width="1.5"/>
  <!-- sleepers below -->
  <rect x="6" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <rect x="16" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <rect x="26" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <rect x="36" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <rect x="46" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <rect x="56" y="46" width="3" height="9" rx="1" fill="#330066" opacity="0.6"/>
  <!-- bridge pillars -->
  <rect x="8" y="34" width="10" height="20" rx="2" fill="#4B0082" stroke="#330066" stroke-width="1.5"/>
  <rect x="46" y="34" width="10" height="20" rx="2" fill="#4B0082" stroke="#330066" stroke-width="1.5"/>
  <!-- bridge deck (road) -->
  <rect x="4" y="26" width="56" height="10" rx="2" fill="url(#road)" stroke="#4B0082" stroke-width="2"/>
  <!-- road markings -->
  <line x1="32" y1="27" x2="32" y2="35" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- guard rails -->
  <line x1="4" y1="26" x2="4" y2="22" stroke="#4B0082" stroke-width="2"/>
  <line x1="60" y1="26" x2="60" y2="22" stroke="#4B0082" stroke-width="2"/>
  <line x1="4" y1="22" x2="60" y2="22" stroke="#4B0082" stroke-width="2.5"/>
  <!-- ROB label -->
  <rect x="20" y="10" width="24" height="10" rx="2" fill="#4B0082"/>
  <text x="32" y="18" text-anchor="middle" font-size="8" fill="white" font-family="Arial" font-weight="bold">ROB</text>
</svg>