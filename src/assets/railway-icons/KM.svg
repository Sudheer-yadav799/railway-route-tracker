<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ks" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>
  <!-- post -->
  <rect x="29" y="54" width="6" height="10" fill="#666"/>
  <rect x="24" y="62" width="16" height="2" rx="1" fill="#444"/>
  <!-- stone body -->
  <polygon points="32,4 54,12 54,54 10,54 10,12" fill="url(#ks)" stroke="#555" stroke-width="2"/>
  <!-- arch top -->
  <ellipse cx="32" cy="12" rx="22" ry="9" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
  <!-- black top half -->
  <polygon points="32,5 53,12 53,30 11,30 11,12" fill="#111"/>
  <ellipse cx="32" cy="12" rx="21" ry="8.5" fill="#111"/>
  <!-- white dividing band -->
  <rect x="10" y="29" width="44" height="4" fill="#fff" stroke="#555" stroke-width="0.5"/>
  <!-- KM text top (white on black) -->
  <text x="32" y="24" text-anchor="middle" font-size="10" fill="white" font-family="Arial" font-weight="bold">KM</text>
  <!-- distance number bottom -->
  <text x="32" y="48" text-anchor="middle" font-size="13" fill="#111" font-family="Arial" font-weight="bold">42</text>
  <!-- side stripes -->
  <line x1="10" y1="36" x2="54" y2="36" stroke="#ccc" stroke-width="0.8"/>
</svg>